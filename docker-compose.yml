services:
  app:
    image: ${BSP_IMAGE:-ghcr.io/belluu/better-status-page:latest}
    ports:
      - "${BSP_BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_PATH: /app/data/db.sqlite
      UPLOAD_DIR: /app/data/uploads
      BACKUP_DIR: /app/backups
    volumes:
      - bsp_data:/app/data
      - bsp_backups:/app/backups
    restart: unless-stopped
    # ICMP ping monitors run as the unprivileged "node" user. If the host kernel does not allow
    # unprivileged ICMP, uncomment this (cap_add: [NET_RAW] alone does not help a non-root user).
    # sysctls:
    #   net.ipv4.ping_group_range: "0 2147483647"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  bsp_data:
    driver: local
  bsp_backups:
    driver: local
